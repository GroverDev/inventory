<!-- Pantalla de carga global mientras hay llamadas a la API en curso -->
@if (loading.isLoading()) {
<div class="position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" style="background: rgba(0, 0, 0, 0.25); z-index: 2000" role="status" aria-live="polite">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem" role="status">
        <span class="visually-hidden">Cargando...</span>
    </div>
</div>
}
