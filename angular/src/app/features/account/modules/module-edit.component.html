<app-breadcrumbs [title]="module.Id ? 'Editar Módulo' : 'Nuevo Módulo'" [breadcrumbItems]="[{ label: 'Cuenta' }, { label: 'Registro de Módulos' }, { label: module.Id ? 'Editar Módulo' : 'Nuevo Módulo', active: true }]"></app-breadcrumbs>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header"><h5 class="card-title mb-0">{{ module.Id ? 'Editar' : 'Nuevo' }} Módulo</h5></div>
            <div class="card-body">
                <app-form-actions [actions]="actions" (back)="back()" />

                <h6 class="text-muted border-bottom pb-2 mb-3"><i class="ri-profile-line align-middle me-1"></i> Identificación del Módulo</h6>
                <div class="row">
                    <div class="col-12 col-sm-6 mb-3">
                        <label class="form-label" for="NameModule">Nombre del Módulo <span class="text-danger">*</span></label>
                        <input type="text" id="NameModule" name="NameModule" class="form-control form-control-sm" [class.is-invalid]="submitted && !module.NameModule.trim()" placeholder="Nombre del Módulo" [disabled]="isSaved()" autocomplete="off" [(ngModel)]="module.NameModule">
                        <small class="invalid-feedback">Requerido.</small>
                    </div>
                </div>

                <h6 class="text-muted border-bottom pb-2 mb-3 mt-2"><i class="ri-code-s-slash-line align-middle me-1"></i> Configuración Técnica</h6>
                <div class="row">
                    <div class="col-12 col-sm-6 mb-3">
                        <label class="form-label" for="Route">Ruta <span class="text-danger">*</span></label>
                        <div class="input-group input-group-sm has-validation">
                            <span class="input-group-text"><i class="ri-link"></i></span>
                            <input type="text" id="Route" name="Route" class="form-control" [class.is-invalid]="submitted && !module.Route.trim()" placeholder="/ruta" [disabled]="isSaved()" autocomplete="off" [(ngModel)]="module.Route">
                            <div class="invalid-feedback">Requerido.</div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-4 col-md-3 mb-3">
                        <label class="form-label" for="ShowOrder">Orden en Menú</label>
                        <input type="number" id="ShowOrder" name="ShowOrder" class="form-control form-control-sm text-end" placeholder="0" min="0" [disabled]="isSaved()" [(ngModel)]="module.ShowOrder">
                    </div>
                    <div class="col-12 col-sm-8 col-md-5 mb-3">
                        <label class="form-label" for="IconCss">Ícono CSS</label>
                        <div class="input-group input-group-sm">
                            <span class="input-group-text"><i [class]="iconClass + ' text-primary'"></i></span>
                            <input type="text" id="IconCss" name="IconCss" class="form-control" placeholder="fal fa-cogs" [disabled]="isSaved()" [(ngModel)]="module.IconCss">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
