<div class="app-menu navbar-menu">
    <!-- LOGO -->
    <div class="navbar-brand-box">
        <!-- Dark Logo-->
        <a routerLink="/" class="logo logo-dark">
            <span class="logo-sm">
                <img src="assets/images/logo-sm.png" alt="" height="22">
            </span>
            <span class="logo-lg">
                <img src="assets/images/logo-dark.png" alt="" height="17">
            </span>
        </a>
        <!-- Light Logo-->
        <a routerLink="/" class="logo logo-light">
            <span class="logo-sm">
                <img src="assets/images/logo-sm.png" alt="" height="22">
            </span>
            <span class="logo-lg">
                <img src="assets/images/logo-light.png" alt="" height="17">
            </span>
        </a>
        <button type="button" class="btn btn-sm p-0 fs-20 header-item float-end btn-vertical-sm-hover"
            id="vertical-hover">
            <i class="ri-record-circle-line"></i>
        </button>
    </div>

    <div id="scrollbar">
        <div class="container-fluid">

            <div id="two-column-menu">
            </div>
            <ul class="navbar-nav" id="navbar-nav">
                @for(item of menuItems; track item.id){
                @if(item.isTitle){
                <li class="menu-title"><span>{{ item.label }}</span></li>
                }@else {
                <li class="nav-item">
                    @if(hasItems(item)){
                    <a href="javascript:void(0);" class="is-parent nav-link menu-link has-arrow"
                        data-bs-toggle="collapse" aria-expanded="false" (click)="toggleItem($event)">
                        <i class="{{ item.icon }} icon nav-icon"></i>
                        <span>{{ item.label }}</span>
                    </a>
                    <div class="collapse menu-dropdown">
                        <ul class="nav nav-sm flex-column" aria-expanded="false">
                            @for(subitem of item.subItems; track subitem.id){
                            <li class="nav-item">
                                <a [routerLink]="subitem.link" class="nav-link"
                                    [attr.data-parent]="subitem.parentId" (click)="updateActive($event)">
                                    {{ subitem.label }}
                                </a>
                            </li>
                            }
                        </ul>
                    </div>
                    }@else{
                    <a [routerLink]="item.link" class="side-nav-link-ref nav-link menu-link">
                        @if(item.icon){<i class="{{ item.icon }} icon nav-icon"></i>}
                        <span>{{ item.label }}</span>
                    </a>
                    }
                </li>
                }
                }
            </ul>
        </div>
        <!-- Sidebar -->
    </div>
</div>
