version: '3.8'

services:

  # ── Base de datos PostgreSQL ──────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pos_db_dos
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: punto_venta_pg
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/backups          # los backups quedan accesibles dentro del contenedor en /backups
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend .NET 10 ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos_backend_dos
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Cadena de conexión única — apunta al servicio "db" de esta red interna.
      #
      # Usa APP_DB_USER, no DB_USER. Son roles distintos a propósito:
      #   DB_USER      superusuario del contenedor; crea la base y corre migraciones.
      #   APP_DB_USER  rol de la aplicación (app_pos), sin superusuario ni BYPASSRLS.
      #
      # Row-Level Security NO se aplica a superusuarios. Si la API se conecta con
      # DB_USER, las políticas de aislamiento entre farmacias quedan inertes y
      # cada cliente vería los datos de los demás, sin ningún error visible.
      ConnectionStrings__DefaultConnection: "Host=db;Database=punto_venta_pg;Username=${APP_DB_USER};Password=${APP_DB_PASSWORD};Port=5432;"
      # JWT
      JwtSettings__Secret:    ${JWT_SECRET}
      JwtSettings__Issuer:    ${JWT_ISSUER}
      JwtSettings__Audience:  ${JWT_AUDIENCE}
      JwtSettings__TimeToken: ${JWT_TIME_TOKEN}
      # Sesión larga con refresh token (web y móvil)
      JwtSettings__TimeTokenRefreshable: ${JWT_TIME_TOKEN_REFRESHABLE:-240}
      JwtSettings__RefreshTokenDays:     ${JWT_REFRESH_TOKEN_DAYS:-30}
      # CORS: sin el origen correcto el navegador bloquea toda la web. El
      # valor por defecto evita dejarla caída si falta la variable en .env.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_WEB:-https://app.ideanueva.com}
      # Nginx corre en el host y alcanza al contenedor por el gateway de la
      # red Docker, cuya IP es dinámica: sin esto se ignora X-Forwarded-For y
      # todos los clientes compartirían un mismo cupo de peticiones.
      # Seguro aquí porque el puerto se publica solo en 127.0.0.1 (ver abajo).
      ForwardedHeaders__TrustAllProxies: "true"
      # Cloudflare Turnstile (captcha del login web). Apagado mientras
      # TURNSTILE_ENABLED no esté en el .env: sin clave secreta el backend no
      # le pide token a nadie. Para encenderlo o apagarlo alcanza con cambiar
      # el .env y hacer "docker compose up -d backend".
      Turnstile__Enabled:   ${TURNSTILE_ENABLED:-false}
      Turnstile__SecretKey: ${TURNSTILE_SECRET:-}
      # MFA / TOTP
      MfaSettings__EncryptionKeyHex:  ${MFA_ENCRYPTION_KEY}
      MfaSettings__MaxFailedAttempts: 5
      MfaSettings__LockoutMinutes:    15
      MfaSettings__Issuer:            PuntoDeVenta
      # Límites de descuento para cajeros
      PosSettings__MaxCashierDiscountPct:    ${POS_MAX_CASHIER_DISCOUNT_PCT}
      PosSettings__MaxCashierDiscountAmount: ${POS_MAX_CASHIER_DISCOUNT_AMOUNT}
    ports:
      - "127.0.0.1:6001:6001"   # Nginx en el VPS hace proxy desde api.ideanueva.com
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # ── Frontend Vue 3 (compilado y servido por Nginx interno) ─
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos_frontend_dos
    restart: always
    ports:
      - "127.0.0.1:8080:80"    # Nginx en el VPS hace proxy desde app.ideanueva.com
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
